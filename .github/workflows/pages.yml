# GitHub Pages 배포 — 관전 페이지 정적 빌드(2026-09-12, 챔피언십 제출: 메모 §3-2 "론처 없이 정적 호스팅에서 열려야 한다").
# 한 번 켜야 한다: 리포 Settings → Pages → Build and deployment → Source = "GitHub Actions".
# main 에 푸시될 때마다 game/dist-static(첨부 판 = game/static-runs.json)을 올린다. LLM 0콜, 키 불필요.
name: pages
on:
  push:
    branches: [main]
    paths: ['game/**', 'viewer/**', 'runs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
        working-directory: game
      - run: npm run build:static
        working-directory: game
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
