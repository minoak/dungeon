<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원더랜드 · 머리 연결 보정</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#171723;color:#f4ebdf}*{box-sizing:border-box}body{max-width:1100px;padding:28px 20px;margin:auto}h1{font-size:26px}p{color:#bfb8cd;line-height:1.7}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:24px 0}label{display:flex;gap:8px;align-items:center}select,button{background:#302b40;color:inherit;border:1px solid #70637e;border-radius:6px;padding:8px;font:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel,.tile{background:#282435;border:1px solid #484055;border-radius:12px;text-align:center;padding:14px}.stage{display:grid;place-items:center;min-height:310px}canvas{image-rendering:pixelated}.stage canvas{width:288px;height:288px}.panel h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.tile{font-size:12px}.tile canvas{width:96px;height:96px;max-width:100%}a{color:#d4b9ff}button:focus-visible,select:focus-visible{outline:3px solid #dfbd7c}@media(max-width:740px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pair{grid-template-columns:1fr}.stage{min-height:240px}.stage canvas{width:240px;height:240px}}
</style></head><body><h1>머리를 옷깃에 맞추고, 걸음에 맞춰 움직이도록</h1><p>같은 바디에 수정 전후 머리를 붙여 비교합니다. 리본 포니테일과 땋은 머리의 옆모습 중심을 바로잡고, 긴 목을 줄였습니다.</p>
<div class="controls"><label>바디 <select id="body"></select></label><label>헤어 <select id="head"></select></label><label>방향 <select id="dir"><option value="front">정면</option><option value="right" selected>오른쪽</option><option value="back">뒷면</option><option value="left">왼쪽</option></select></label><label><input id="walk" type="checkbox" checked>걷기</label><label>동작 <input id="frame" type="range" min="0" max="4" value="0" disabled></label></div>
<div class="pair"><section class="panel"><h2>수정 전</h2><div class="stage"><canvas id="before" width="96" height="96"></canvas></div></section><section class="panel"><h2>수정 후</h2><div class="stage"><canvas id="after" width="96" height="96"></canvas></div></section></div>
<h2>공용 헤어 14종</h2><p>선택한 바디와 방향을 모든 헤어에 적용한 수정 후 모습입니다.</p><div id="grid" class="grid"></div><p><a href="../index.html?heads=2">8종 바디 의상실로 →</a></p>
<script type="module">
import{loadAssets,drawCharacter}from'../../character-bases-v1/modular-pilot/compose.js';
import{drawCharacter as drawBefore}from'./before/compose.js';
window.reviewReady=(async()=>{
const old=await loadAssets(new URL('./before/',import.meta.url)),current=await loadAssets(new URL('../',import.meta.url)),body=document.querySelector('#body'),head=document.querySelector('#head'),dir=document.querySelector('#dir'),walk=document.querySelector('#walk'),frame=document.querySelector('#frame'),tiles=[];
for(const[sel,entries,value]of[[body,current.manifest.bodies,'archer-female'],[head,current.manifest.heads,'archer-ponytail']])for(const[id,v]of Object.entries(entries)){const o=document.createElement('option');o.value=id;o.textContent=v.name;o.selected=id===value;sel.append(o);}
for(const[id,v]of Object.entries(current.manifest.heads)){const tile=document.createElement('div');tile.className='tile';const c=document.createElement('canvas');c.width=c.height=96;const name=document.createElement('div');name.textContent=v.name;tile.append(c,name);document.querySelector('#grid').append(tile);tiles.push({id,c});}
function draw(c,assets,fn,h,col){const g=c.getContext('2d');g.clearRect(0,0,96,96);fn(g,assets,body.value,h,dir.value,col);}
function render(now){const col=walk.checked?1+Math.floor(now/current.manifest.frameMs)%4:Number(frame.value);draw(document.querySelector('#before'),old,drawBefore,head.value,col);draw(document.querySelector('#after'),current,drawCharacter,head.value,col);for(const {id,c}of tiles)draw(c,current,drawCharacter,id,col);}
walk.onchange=()=>{frame.disabled=walk.checked;};function tick(now){render(now);requestAnimationFrame(tick);}requestAnimationFrame(tick);return{old,current,drawBefore,drawCharacter};
})();
</script></body></html>
