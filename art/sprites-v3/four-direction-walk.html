<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전사 4방향 걷기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#20242c;color:#eadfcf;font:16px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:26px}h2{font-size:18px}p{color:#bbc5d3}button,input{font:inherit}button{background:#384557;color:inherit;border:1px solid #718198;border-radius:6px;padding:8px 16px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#292f3b;border-radius:12px;padding:12px;text-align:center}canvas{image-rendering:pixelated;max-width:100%;height:auto}.small{display:block;margin:16px auto}.bar{display:flex;gap:20px;align-items:center;margin:20px 0;flex-wrap:wrap}a{color:#e3bd81}.sheet{width:100%;height:auto}label{display:flex;gap:8px;align-items:center}summary{cursor:pointer}.tag{font-size:12px;color:#bdc9db}.note{font-size:14px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){main{padding:14px}.cards{gap:10px}.bar{gap:12px}.card{padding:8px}}
</style><main><h1>전사 · 4방향 걷기</h1><p>정면과 오른쪽 승인본에 왼쪽·뒷면 걷기를 더했습니다.</p>
<div class="bar"><button id="play">일시정지</button><label>프레임 간격 <input id="speed" type="range" min="100" max="300" step="20" value="160"><span id="ms">160ms</span></label><label>프레임 <input id="frame" type="range" min="0" max="3" value="0"></label><span id="num">1 / 4</span></div>
<section class="cards" id="cards"></section><p id="status" role="status">이미지를 불러오는 중입니다.</p>
<p class="note">위는 확대, 아래는 작은 표시입니다. 방향별 시트의 같은 번호가 정확히 같은 발동작을 뜻하지는 않습니다. 머리·무기 위치와 다리가 교차하는 모습을 비교해 보세요.</p>
<details><summary>방향별 생성 원본 보기·저장</summary><div id="sources"></div></details>
<p class="note">이미지 생성으로 만든 4방향 × 4프레임입니다. 원본은 그대로 보존하고 머리 중심을 기준으로 표시 영역만 맞췄습니다. 아직 분홍 배경을 포함한 시안이며, 정확한 16×16 변환이나 게임 반영은 하지 않았습니다.</p>
</main><script>
const DATA={"front":{"file":"warrior-front-walk-generated.png","crops":[[64,166,358,529],[491,166,358,529],[916,166,358,529],[1341,166,358,529]],"bounds":[[87,185,382,677],[509,185,809,677],[935,184,1234,677],[1365,184,1659,673]]},"right":{"file":"warrior-right-walk-generated.png","crops":[[159,114,290,500],[661,114,290,500],[1182,114,290,500],[1692,114,290,500]],"bounds":[[178,133,430,596],[679,133,933,595],[1200,133,1454,596],[1712,132,1962,595]]},"back":{"file":"warrior-back-walk-generated.png","crops":[[130,77,377,553],[619,77,377,553],[1116,77,377,553],[1613,77,377,553]],"bounds":[[173,95,487,611],[663,95,978,611],[1162,95,1474,611],[1658,95,1970,612]]},"left":{"file":"warrior-left-walk-generated.png","crops":[[179,105,285,513],[666,105,285,513],[1166,105,285,513],[1684,105,285,513]],"bounds":[[197,124,446,600],[689,124,929,600],[1187,123,1429,600],[1709,124,1945,600]]}},DIRS=['front','right','back','left'],LABELS={front:'정면',right:'오른쪽',back:'뒷면',left:'왼쪽'},q=s=>document.querySelector(s),images={};let ready=0,phase=0,playing=true,previous=0;
for(const d of DIRS){const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+LABELS[d]+'</h2><div class="tag">'+(['front','right'].includes(d)?'승인본':'새 시안')+'</div><canvas id="'+d+'" width="224" height="308" aria-label="'+LABELS[d]+' 걷기 확대"></canvas><canvas id="'+d+'Small" class="small" width="64" height="88" aria-label="'+LABELS[d]+' 걷기 작은 표시"></canvas>';q('#cards').append(card);const source=document.createElement('div');source.innerHTML='<h2>'+LABELS[d]+'</h2><img class="sheet" src="'+DATA[d].file+'" alt="'+LABELS[d]+' 걷기 네 프레임"><a href="'+DATA[d].file+'" download>원본 저장</a>';q('#sources').append(source)}
function draw(){if(ready!==4)return;for(const d of DIRS){const [x,y,w,h]=DATA[d].crops[phase];for(const id of ['#'+d,'#'+d+'Small']){const c=q(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.imageSmoothingEnabled=false;const scale=Math.min(c.width/w,c.height/h);g.drawImage(images[d],x,y,w,h,(c.width-w*scale)/2,0,w*scale,h*scale)}}q('#frame').value=phase;q('#num').textContent=(phase+1)+' / 4'}
for(const d of DIRS){const im=new Image();images[d]=im;im.onload=()=>{ready++;if(ready===4){q('#status').textContent='네 방향 준비 완료 · 방향마다 4프레임 반복 재생';draw()}};im.onerror=()=>q('#status').textContent=LABELS[d]+' 원본 PNG를 불러오지 못했어요. 같은 폴더의 파일을 확인해 주세요.';im.src=DATA[d].file}
function loop(t){if(ready===4&&playing&&t-previous>=Number(q('#speed').value)){phase=(phase+1)%4;previous=t;draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
q('#play').onclick=()=>{playing=!playing;previous=performance.now();q('#play').textContent=playing?'일시정지':'재생'};q('#frame').oninput=e=>{playing=false;q('#play').textContent='재생';phase=Number(e.target.value);draw()};q('#speed').oninput=()=>q('#ms').textContent=q('#speed').value+'ms';
</script></html>
