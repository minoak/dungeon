<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원더랜드 · 실제 픽셀 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#20242c;color:#ecdfcb;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px}h1{font-size:26px;margin:0 0 8px}p{color:#b9c2cd}button,select,a{font:inherit}button,select{background:#323b48;color:#fff;border:1px solid #718096;border-radius:6px;padding:6px 12px}a{color:#e1bb7f}section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}article{background:#282e38;padding:20px;border-radius:12px;text-align:center}h2{margin:0}.stage{height:310px;display:flex;align-items:center;justify-content:center;margin:15px 0;background:#20242c;border-radius:8px}canvas{image-rendering:pixelated;max-width:100%}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.small{display:flex;justify-content:space-evenly;align-items:end;gap:8px;height:100px}.small label{font-size:13px;color:#bac3cf;display:flex;flex-direction:column;align-items:center;gap:8px}.note{font-size:14px}footer{margin-top:28px}@media(max-width:650px){main{padding:16px}section{gap:8px}article{padding:10px}.stage{height:190px}}
</style><main><h1>전사 · 실제 16×16 / 32×32</h1><p>같은 머리 중심 비율과 고정 검. 큰 시안을 축소하지 않고 픽셀 행렬로 만든 정면 비교안입니다.</p>
<div class="controls"><label>표시 크기 <select id="size"><option>32</option><option>48</option><option>64</option><option>96</option><option>128</option><option selected>256</option></select> px</label><label><input id="grid" type="checkbox"> 픽셀 격자</label><label>배경 <select id="bg"><option value="#20242c">어두운 배경</option><option value="#ded8c8">밝은 배경</option><option value="#47423b">던전색 배경</option></select></label></div>
<section id="cards"></section><p id="scaleNote" class="note"></p><footer><p>16×16: 턱까지 11행, 몸·발 5행. 32×32: 같은 기본 실루엣에서 머리 음영·눈·갑옷·검을 더 작은 픽셀로 조정했습니다. 자동으로 해상도만 높였을 때의 차이를 뜻하지는 않습니다.</p><p class="note">이 화면은 크기 비교용이며 실제 게임 화면은 아닙니다. 기존 게임에는 적용하지 않았습니다. PNG 배경은 투명하고, 방향·걷기는 포함하지 않습니다.</p></footer></main>
<script>
const DATA={"description":"손으로 배치한 팔레트 행렬. 32px는 같은 실루엣에서 세부 픽셀을 추가한 비교안.","palette":{".":"#00000000","#":"#292329","h":"#905432","H":"#b87845","s":"#f2c599","E":"#201b20","A":"#aebbc2","a":"#657989","b":"#384a65","g":"#c3934e","l":"#604631","G":"#a5793b","W":"#e2ebed","t":"#d9a77a","J":"#cc9056","S":"#d8e1e2","d":"#70452e"},"sprites":[{"name":"warrior-16","size":16,"rows":[".....#####......","...##hhhhH##....","..#hhHHHhhhh#...","..#hHHhhhhhH#...",".#hhhhhhHhhhh#..",".#hhhHhsshhhh#..",".#hsssssssshh#..",".#ssEsssEssss#..","..#sssssssss#...","...#sssssss#....","....#######.....","...#AaAAAaA#....","..Gs#AaaaA#s#...",".#WG#bbgbb###...",".#W#.#ll#ll#....",".##..#######...."]},{"name":"warrior-32","size":32,"rows":["..........##########............","..........##########............","......####hhhhhhhhHH####........","......####hHHHHHHHHH####........","....##hhhJJJJJJHhhhhhhhh##......","....##hhHHHHHHHHhhhhhhhh##......","....##HHHHHHhhhhHHHHHHHH##......","....##hhHHHHhhhHHHHHhhHH##......","..##hhhhhhhhhhhhhhhhhhhhhh##....","..##hhhhhhhhhhhhHHhhhhhhhh##....","..##hhhhhddddhsssshhhhhhhh##....","..##hhhhdddHhhssssshhhhhhh##....","..##hhsttssssssssssssshhhh##....","..##hhttsssssssssssssshhhh##....","..##ssttsEsssssssEssssssss##....","..##ssttsEsssssssEssssssss##....","....##ttssssssssssssssss##......","....##ssttssssssssssssss##......","......##ssttssssssssss##........","......##ssssttttttttss##........","........##############..........","........##############..........","......##SSSSAAAAAAaaSSSS........","......##AAAaAASSSSSSAAA#........","....Gsss##AAaaaAAAAA##ss##......","....Gtss##AAaaaaaaaa##ss##......","..##WGGG##baabggbbbaa#####......","..##WWGG##bbbbGGbbbb######......","..#SWW##..##llll##llll##........","..#WWW##..#ddddl##ldddd#........","..####....##############........","..####....##############........"]}]};
function render(c,s,px,grid=false){c.width=c.height=px;const g=c.getContext('2d');g.imageSmoothingEnabled=false;const base=document.createElement('canvas');base.width=base.height=s.size;const b=base.getContext('2d');s.rows.forEach((r,y)=>[...r].forEach((v,x)=>{if(v!=='.'){b.fillStyle=DATA.palette[v];b.fillRect(x,y,1,1)}}));g.drawImage(base,0,0,px,px);if(grid&&px>=s.size*4){g.strokeStyle='rgba(200,210,230,.18)';g.lineWidth=1;for(let i=0;i<=s.size;i++){let a=i*px/s.size+.5;g.beginPath();g.moveTo(a,0);g.lineTo(a,px);g.stroke();g.beginPath();g.moveTo(0,a);g.lineTo(px,a);g.stroke()}}}
DATA.sprites.forEach(s=>{const a=document.createElement('article');a.innerHTML='<h2>'+s.size+' × '+s.size+'</h2><div class="stage"><canvas class="hero" aria-label="'+s.size+'픽셀 전사"></canvas></div><div class="small"></div><p><a download href="'+s.name+'.png">투명 PNG 저장</a></p>';[32,48,64].forEach(px=>{const l=document.createElement('label'),c=document.createElement('canvas');render(c,s,px);l.append(c,document.createTextNode(px+'px 표시'));a.querySelector('.small').append(l)});document.querySelector('#cards').append(a)});
function update(){let px=Number(document.querySelector('#size').value),grid=document.querySelector('#grid').checked;document.querySelectorAll('article').forEach((a,i)=>{render(a.querySelector('.hero'),DATA.sprites[i],px,grid);a.querySelector('.stage').style.background=document.querySelector('#bg').value});document.querySelector('#scaleNote').textContent=px%32?'32×32는 현재 비정수 배율이라 픽셀 너비가 고르지 않게 표시될 수 있습니다. 32·64·96·128·256px에서도 비교해 보세요.':'현재 두 이미지 모두 정수 배율로 표시됩니다. 화면이 좁으면 브라우저가 표시 크기를 줄일 수 있습니다.'}
document.querySelectorAll('select,input').forEach(e=>e.addEventListener('change',update));update();
</script></html>
