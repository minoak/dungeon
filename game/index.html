<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봇픽던 — 관전</title>
<link rel="icon" href="data:,">   <!-- favicon 404 방지 -->
<!-- 초점 캐릭터 카메라 뷰어(GAME_CLIENT_PLAN_2026-09-09). stream.jsonl 의 순수 소비자, LLM 0콜.
     레이아웃: 상단 원정 선택 / 무대 | 모험가 초상·현재 상태 / 재생 바·원정 기록(접기 가능). -->
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="brand" href="/launcher/" aria-label="봇픽던 시작 화면">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 2 38 20 20 38 2 20Z" stroke="currentColor"/><path d="m20 8 4 12-4 12-4-12Z" fill="currentColor"/><path d="M8 20h24" stroke="currentColor"/></svg>
      <span><strong>봇픽던</strong><small>모험가들의 이야기</small></span>
    </a>
    <div class="top-actions"><div id="runPicker"></div><button id="codexBtn" type="button" class="codex-btn" aria-pressed="false" aria-controls="codex" title="캐릭터가 알게 된 것(도감)과 쓴 것(수첩) — 재생 위치까지">도감·수첩</button><a class="home-link" href="/launcher/">시작 화면 <span aria-hidden="true">↗</span></a></div>
  </header>
  <main id="stage" aria-label="무대">
    <div id="overlay"></div>          <!-- 말풍선·지문 등 DOM 오버레이(Bubbles) — 카메라 좌표는 app.scene.project() -->
    <div id="hud"></div>              <!-- 무대 위 고정 표식(LIVE 배지 등) -->
    <div id="sceneCaption"><span class="scene-dot"></span><span id="focusCaption">모험가를 따라가는 중</span></div>
    <div class="stage-help"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 시점 전환 <span>·</span> <kbd>Space</kbd> 재생 / 정지</div>
  </main>
  <aside id="side" aria-label="모험가 정보">
    <div class="section-head"><h1>모험가</h1><span>초상을 눌러 시점 전환</span></div>
    <div id="chips"></div>            <!-- 캐릭터 칩(Chips) — 클릭·숫자키로 초점 전환 -->
    <div id="focusCard"></div>        <!-- 초점 카드(FocusCard) -->
  </aside>
  <section id="bottom">
    <div id="controls"></div>         <!-- 재생 컨트롤(Controls) -->
    <div id="journalHead"><span class="journal-title">원정 기록</span><div class="log-tabs" aria-label="기록 표시">
      <button data-log-view="story" class="on" aria-pressed="true">이야기</button><button data-log-view="all" aria-pressed="false">모든 기록</button>
    </div><span class="journal-hint">대화와 주요 사건</span></div>
    <div id="log" data-view="story" tabindex="0" aria-label="원정 기록"></div>
  </section>
  <aside id="codex" hidden data-open="0" aria-label="도감·수첩"></aside>   <!-- 도감·수첩 창(Codex, D63) — 헤더 버튼으로 여닫는 별개 창 -->
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
